<div class="breadcrumb-container">
    <button mat-icon-button color="accent">
      <mat-icon>home</mat-icon>
    </button>
  <div class="">
    <ul>
      <li *ngFor="let breadcrumb of (breadcrumbs$ | async)">
        <a [routerLink]="breadcrumb.url" *ngIf="breadcrumb.isLink">{{ breadcrumb.label }}</a>
        <span *ngIf="!breadcrumb.isLink">{{ breadcrumb.label }}</span>
      </li>
    </ul>
  </div>
</div>

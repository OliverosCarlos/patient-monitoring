<div class="sidenav-container" sidenav >
  <div class="sidenav" [@navAnimation]="currentState">
    <button mat-icon-button (click)="changeNavState()">
      <mat-icon>menu</mat-icon>
    </button>
    <app-side_menu></app-side_menu>
  </div>
  <div class="sidenav-content" [@navContentAnimation]="currentState">
    <div class="side-nave-header mat-elevation-z2">
      <div class="breadcrumb">
        <app-breadcrumb></app-breadcrumb>
      </div>
      <div class="content-right">
        <div class="action-group">
            <button mat-icon-button color="primary" aria-label="Example icon button with a home icon">
                <mat-icon fontSet="material-symbols-outlined" class="icon-primary">notifications</mat-icon>
            </button>
            <button mat-icon-button #calendarBtn (click)="togglePanel()" color="accent" aria-label="Example icon button with a home icon">
                <mat-icon fontSet="material-symbols-outlined" class="icon-primary">calendar_month</mat-icon>
            </button>
        </div>
        <div class="perfil_menu">
          <app-perfil_menu></app-perfil_menu>
        </div>
      </div>

    </div>

    <div [@routeAnimations]="getRouteAnimationData()" class="viewer-content">
      <router-outlet></router-outlet>
    </div>
    
  </div>
</div>

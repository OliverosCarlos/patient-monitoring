<!-- File generated by vaweei CLI -->
<ngx-spinner name="loading" [fullScreen]="false" type="timer" size="medium"></ngx-spinner>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Checkbox Column -->
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
        [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- patient Column -->
  <ng-container matColumnDef="patient">
    <th mat-header-cell *matHeaderCellDef> Paciente </th>
    <td mat-cell *matCellDef="let element"> {{ element.patient.full_name }} </td>
  </ng-container>

  <!-- email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Tipo </th>
    <td mat-cell *matCellDef="let element"> {{ element.patient.type.desc }} </td>
  </ng-container>

  <!-- therapy_objectives Column -->
  <ng-container matColumnDef="therapy_objectives">
    <th mat-header-cell *matHeaderCellDef> Obetivos </th>
    <td mat-cell *matCellDef="let element">
      <span>
        {{ element.therapy_objectives.notes }}
      </span>
    </td>
  </ng-container>

  <!-- personal_characteristics Column -->
  <ng-container matColumnDef="personal_characteristics">
    <th mat-header-cell *matHeaderCellDef> Características </th>
    <td mat-cell *matCellDef="let element"> {{ element.personal_characteristics.notes }} </td>
  </ng-container>

  <!-- personal_characteristics Column -->
  <ng-container matColumnDef="report">
    <th mat-header-cell *matHeaderCellDef> Características </th>
    <td mat-cell *matCellDef="let element">
      <button (click)="showMedicalHistoryReport($event, element)" class="icon-color" mat-icon-button
        [disabled]="element.medical_history_report.length < 1" aria-label="Reporte">
        <mat-icon>assignment</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns">
  </tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="show(row)" class="show-box-event">
  </tr>
</table>

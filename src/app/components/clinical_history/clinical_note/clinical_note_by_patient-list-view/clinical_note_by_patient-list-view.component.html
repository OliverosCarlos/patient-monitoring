<!-- File generated by vaweei CLI -->
<!-- <ngx-spinner name="loading" [fullScreen]="false" type="timer" size="medium"></ngx-spinner> -->
<ng-container *ngIf="!isEmpty">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- session_objective Column -->
      <ng-container matColumnDef="session_objective">
        <th mat-header-cell *matHeaderCellDef> Objetivo </th>
        <td mat-cell *matCellDef="let element"> {{ element.session_objective }} </td>
      </ng-container>

      <!-- session_approach Column -->
      <ng-container matColumnDef="session_approach">
        <th mat-header-cell *matHeaderCellDef> Abordaje </th>
        <td mat-cell *matCellDef="let element"> {{ element.session_approach }} </td>
      </ng-container>

      <!-- created_at Column -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let element"> {{ element.created_at }} </td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="viewRecord(row)">
    </tr>
  </table>
</ng-container>
<ng-container *ngIf="isEmpty">
  <div class="empty-data-container">
    <span class="text">
      No hay datos para mostrar.
    </span>
    <img src="./assets/caja-vacia.png" alt="" srcset="">
  </div>
</ng-container>

<!-- File generated by vaweei CLI -->
<form [formGroup]="formGroup" class="col-12">
  <div class="row">
    <!-- patient field -->
    <div class="col-md-12 mt-3">
      <patient-select (eventSetData)="setPatient($event)"></patient-select>
    </div>

    <!-- session_objective field -->
    <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Objetivo de la sesión</mat-label>
        <input matInput placeholder="Placeholder" formControlName="session_objective" required>
        <mat-icon matSuffix fontSet="material-symbols-outlined">user_attributes</mat-icon>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>

    <!-- session_approach field -->
    <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Descripción y abordaje de la sesión</mat-label>
        <input matInput placeholder="Placeholder" formControlName="session_approach" required>
        <mat-icon matSuffix fontSet="material-symbols-outlined">user_attributes</mat-icon>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>

    <!-- clinical_progress field -->
    <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Avances clínicos notados</mat-label>
        <textarea matInput placeholder="Placeholder" formControlName="clinical_progress" required></textarea>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>

    <!-- state_of_mind field -->
    <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Estado anímico durante la sesión</mat-label>
        <textarea matInput placeholder="Placeholder" formControlName="state_of_mind" required></textarea>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>
    <!-- conducts_and_non_verbal_languages field -->
    <div class="col-md-6 mt-3">
      <mat-form-field appearance="outline">
        <mat-label>Conductas y lenguaje no verbal</mat-label>
        <textarea matInput placeholder="Placeholder" formControlName="conducts_and_non_verbal_languages" required></textarea>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>
    <!-- observations field -->
    <div class="col-md-6 mt-3">
      <mat-form-field appearance="outline">
        <mat-label>Observaciones</mat-label>
        <textarea matInput placeholder="Placeholder" formControlName="observations" required></textarea>
        <mat-hint>Hint</mat-hint>
        <mat-error>error</mat-error>
      </mat-form-field>
    </div>

  </div>
  <br>
  <div class="row">
    <div class="col-md-12">
      <span class="text-danger">* </span> <label for=""> Campos obligatorios</label>
    </div>
  </div>
</form>
